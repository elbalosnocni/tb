<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cổng Thông Báo Nội Bộ - Liwayway Việt Nam</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033;line-height:1.5}
.hidden{display:none!important}

/* External Links Bar */
.external-nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px;background:#fff;border-bottom:1px solid #e8ecf2}
.ext-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;background:#f8fafc;color:#334155;font-weight:600;font-size:13px;text-decoration:none;border:1px solid #e2e8f0;transition:all .2s}
.ext-link:hover{background:#edf2ff;color:#2563eb;border-color:#bfdbfe;transform:translateY(-1px)}
.ext-link.active{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border:none}

/* Auth Section */
.login{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf2ff,#f8fafc)}
.login-card{width:min(430px,100%);background:#fff;padding:34px;border-radius:22px;box-shadow:0 20px 60px rgba(23,32,51,.1)}
.brand{font-weight:800;color:#2457d6;letter-spacing:.5px}
.login h1{font-size:22px;margin:12px 0 5px}
.muted{color:#667085;font-size:14px}
label{display:block;font-weight:600;margin:15px 0 6px;font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:1px solid #d7deea;border-radius:10px;background:#fff;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:#2457d6}
textarea{min-height:160px;resize:vertical}
.btn{border:1px solid #d7deea;background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;transition:.2s}
.btn:hover{background:#f7f8fa}.btn:disabled,.primary:disabled{opacity:.6;cursor:not-allowed}.loading-box small{font-weight:500;color:#667085}
.primary{border:0;background:#2457d6;color:#fff;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;transition:background .2s}
.primary:hover{background:#1e40af}
.full{width:100%;margin-top:20px}
.error{color:#b42318;min-height:20px;font-size:14px;margin-top:8px}

/* App Header & Navigation */
.top{height:64px;background:#fff;border-bottom:1px solid #e8ecf2;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}
.user{display:flex;align-items:center;gap:10px}
.nav{display:flex;gap:6px;padding:8px 24px;background:#fff;border-bottom:1px solid #e8ecf2;position:sticky;top:64px;z-index:9;overflow-x:auto}
.nav button{border:0;background:transparent;padding:9px 14px;border-radius:8px;white-space:nowrap;cursor:pointer;font-weight:600;color:#475569}
.nav button.active,.nav button:hover{background:#edf2ff;color:#2457d6}

/* Layout Content */
.wrap{max-width:1200px;margin:auto;padding:24px 16px}
.hero{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #e7ebf2;border-radius:12px;padding:14px 18px;min-width:130px}
.stat b{font-size:22px;display:block;margin-top:2px;color:#2457d6}
.filters{background:#fff;border:1px solid #e7ebf2;border-radius:14px;padding:15px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;margin-bottom:16px}
.cards{display:grid;gap:12px}
.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:18px;cursor:pointer;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 8px 24px rgba(23,32,51,.08);transform:translateY(-1px)}
.card.unread{border-left:4px solid #e53935}
.head{display:flex;justify-content:space-between;align-items:center}
.badge{display:inline-block;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;background:#edf2ff;color:#315bc9}
.badge.red{background:#fff0f0;color:#b42318}
.title{font-size:17px;font-weight:700;margin:8px 0 4px}
.meta{font-size:12px;color:#667085}
.content{white-space:pre-wrap;line-height:1.6}

/* Modals & Tables */
.modal{position:fixed;inset:0;background:rgba(16,24,40,.6);z-index:50;display:grid;place-items:center;padding:20px}
.modalbox{background:#fff;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow-y:auto;padding:24px}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.close{border:0;background:none;font-size:24px;cursor:pointer;color:#667085}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tablebox{background:#fff;border:1px solid #e5e9f0;border-radius:12px;overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:12px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}
.actions{display:flex;gap:6px}
.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:20px;text-align:center;margin-top:12px;background:#f8fafc}
.attachment{background:#f8fafc;border-radius:12px;padding:14px;margin-top:16px;border:1px solid #e2e8f0}
.attachment iframe{width:100%;height:480px;border:0;margin-top:10px;border-radius:8px}
.target{display:flex;gap:8px;margin:8px 0}

/* Loaders & Links */
.detail-link{display:inline-flex;align-items:center;gap:4px;margin-top:12px;color:#2457d6;font-weight:700;font-size:13px}
.loading-overlay{position:fixed;inset:0;background:rgba(16,24,40,.4);z-index:100;display:grid;place-items:center}
.loading-box{background:#fff;border-radius:14px;padding:18px 24px;box-shadow:0 20px 40px rgba(0,0,0,.15);display:flex;align-items:center;gap:12px;font-weight:600}
.spinner{width:22px;height:22px;border:3px solid #dbe3f2;border-top-color:#2457d6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
    .filters{grid-template-columns:1fr}
    .grid2{grid-template-columns:1fr}
    .hero{flex-direction:column;align-items:flex-start}
    .user #who{display:none}
}
</style>
</head>
<body>

 <nav class="external-nav">
     <a href="#" class="ext-link active">📢 Thông báo</a>
     <a href="https://bangchamcong.pages.dev" target="_blank" rel="noopener" class="ext-link">📋 Chấm Công</a>
     <a href="https://phepnam.pages.dev" target="_blank" rel="noopener" class="ext-link">📅 Phép năm</a>
     <a href="https://noiquy.pages.dev" target="_blank" rel="noopener" class="ext-link">📜 Lỗi cơm</a>
     <a href="https://phucap.pages.dev" target="_blank" rel="noopener" class="ext-link">🥛 Phụ cấp sữa</a>
     <a href="https://noikhambenh.pages.dev" target="_blank" rel="noopener" class="ext-link">🏥 BHXH</a>
     <a href="https://antoan.pages.dev" target="_blank" rel="noopener" class="ext-link">🛡️ An Toàn</a>
     <a href="https://xnc-immigration.pages.dev" target="_blank" rel="noopener" class="ext-link">🛂 Immigration</a>
 </nav>

 <section id="login" class="login">
  <div class="login-card">
   <div class="brand">🏭 CÔNG TY CP LIWAYWAY VIỆT NAM</div>
   <h1>THÔNG BÁO NỘI BỘ</h1>
   <p class="muted">Chỉ lưu hành nội bộ, không được chia sẻ.</p>
   <p style="margin:5px 0;">📱 Quét QR để tra cứu nhanh</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://thongbao.pages.dev/" alt="QR Code">   
   <label for="employeeId">Số Căn Cước</label>
   <input id="employeeId" placeholder="Ví dụ: 012345678999" autocomplete="username" inputmode="numeric">
   <button class="primary full" id="loginBtn">ĐĂNG NHẬP</button>
   <div id="loginError" class="error"></div>
  </div>
 </section>

 <section id="app" class="hidden">
  <header class="top">
   <div class="brand">🏭 LIWAYWAY VIỆT NAM <span style="font-weight:500;color:#475569">| THÔNG BÁO</span></div>
   <div class="user">
    <span id="who"></span>
    <button class="btn" id="logoutBtn">Đăng xuất</button>
   </div>
  </header>

  <nav class="nav">
   <button data-page="home" class="active">🏠 Trang chủ</button>
   <button data-page="notices">📢 Thông báo</button>
   <button data-page="important">📌 Quan trọng</button>
   <button data-page="profile">👤 Cá nhân</button>
   <button id="adminNav" class="hidden" data-page="admin">⚙️ Quản trị</button>
  </nav>

  <main class="wrap">
   <div id="home"></div>
   <div id="notices" class="hidden"></div>
   <div id="important" class="hidden"></div>
   <div id="profile" class="hidden"></div>
   <div id="admin" class="hidden"></div>
  </main>
 </section>

 <div id="modal" class="modal hidden"></div>
 <div id="loading" class="loading-overlay hidden" aria-live="polite">
  <div class="loading-box"><span class="spinner"></span><span id="loadingText">Đang xử lý...</span></div>
 </div>

<script>
/* ==========================================================
   1) CHỈ CẦN ĐỔI URL NÀY
   ========================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz9RJAgZlJB8wRlKDtaSTCVXmlUXZU1CZZT1CCduqGIIF3MZmGc5YKSx05Zy75co-VE/exec';

/* ========================================================== */
const state={token:'',user:null,dashboard:null,filters:{},adminEmployees:[]};
let adminEmployeeSearch='';
const TYPES=['📢 Thông báo chung','🕐 Thời gian làm việc','💰 Lương & thưởng','🎁 Phúc lợi','🏥 Sức khỏe','🦺 An toàn / HSE','🏭 Sản xuất','📋 Nhân sự','🎉 Hoạt động công ty','⚠️ Khẩn cấp'];

const $=id=>document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(x){return esc(x)}
function toast(m){alert(m)}
function fmt(x){if(!x)return'';const d=new Date(x);return isNaN(d)?String(x):d.toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}
function htmlContent(x){return esc(x).replace(/\n/g,'<br>')}
function setLoading(on,text='Đang xử lý...'){ $('loadingText').textContent=text; $('loading').classList.toggle('hidden',!on); document.body.style.overflow=on?'hidden':''; }
async function withLoading(text,fn){setLoading(true,text);try{return await fn()}finally{setLoading(false)}}

async function api(action,data={}){
 if(API_URL.includes('PASTE_YOUR')) throw new Error('Bạn chưa dán URL /exec của Google Apps Script vào API_URL.');
 const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});
 const text=await res.text();
 let j;try{j=JSON.parse(text)}catch(e){throw new Error((text.includes('<!DOCTYPE')||text.includes('<html'))?'GAS đang trả về HTML thay vì JSON. Hãy Deploy > Manage deployments > Edit > New version và dùng đúng URL /exec.':'API trả về dữ liệu không hợp lệ.')}
 if(!j.ok) throw new Error(j.error||'Có lỗi xảy ra.');
 return j;
}

async function boot(){resetSession(false);showLogin()}
function showLogin(){
  $('login').classList.remove('hidden');$('app').classList.add('hidden');$('adminNav').classList.add('hidden');
}
function resetSession(clearInputs=true){
  state.token='';state.user=null;state.dashboard=null;state.filters={};state.adminEmployees=[];
  if(clearInputs && $('employeeId')) $('employeeId').value='';
  $('adminNav').classList.add('hidden');
  $('who').textContent='';
  ['home','notices','important','profile','admin'].forEach(x=>$(x).innerHTML='');
  closeModal();
}
function isAdmin(){return !!state.user && ['ADMIN','HR'].includes(String(state.user.role||'').toUpperCase())}
function enter(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('who').textContent=`Xin chào ${state.user.fullName}`;
  $('adminNav').classList.toggle('hidden',!isAdmin());
  load();
}
async function login(){
  $('loginError').textContent='';
  const employeeId=$('employeeId').value.trim();
  if(!employeeId){$('loginError').textContent='Vui lòng nhập EmployeeID / số căn cước.';return}
  await withLoading('Đang xác thực...',async()=>{
    try{
      resetSession(false);
      const r=await api('login',{employeeId,userAgent:navigator.userAgent});
      state.token=r.token;state.user=r.user;
      $('employeeId').value='';
      enter();
    }catch(e){
      resetSession(false);
      $('loginError').textContent=e.message;
    }
  });
}
async function logout(){
  const oldToken=state.token;
  try{if(oldToken)await api('logout',{token:oldToken})}catch(e){}
  finally{resetSession(true);showLogin()}
}
async function load(){
  await withLoading('Đang tải thông báo...',async()=>{
    try{state.dashboard=await api('dashboard',{token:state.token,filters:state.filters});renderHome();renderNotices()}
    catch(e){if(e.message.includes('hết hạn')){resetSession(true);showLogin();$('loginError').textContent=e.message}else toast(e.message)}
  });
}
function nav(page){
 ['home','notices','important','profile','admin'].forEach(x=>$(x).classList.add('hidden'));
 $(page).classList.remove('hidden');
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='profile')renderProfile();
 if(page==='admin')renderAdmin();
}
function card(a){
 return `<div class="card ${a.unread?'unread':''}" onclick="openNotice('${attr(a.id)}')">
 <div class="head"><span class="badge">${esc(a.type)}</span><span>${a.pinned?'📌':''}</span></div>
 <div class="title">${esc(a.title)}</div>
 <div class="meta">${fmt(a.publishDate)} · ${esc(a.author||'')}</div>
 <div style="margin-top:10px">${htmlContent(String(a.content||'').replace(/<[^>]*>/g,' ').slice(0,230))}${String(a.content||'').length>230?'…':''}</div>
 <div style="margin-top:10px">${a.unread?'<span class="badge red">🔴 Chưa đọc</span>':'<span class="badge">✓ Đã đọc</span>'}</div><div class="detail-link">Bấm vào xem chi tiết →</div>
 </div>`;
}
function renderHome(){
 const d=state.dashboard;
 $('home').innerHTML=`<div class="hero"><div><h2>Xin chào ${esc(state.user.fullName)} 👋</h2><div class="muted">Thông báo mới nhất dành cho ${esc(state.user.department||'bạn')}.</div></div>
 <div class="stat">🔴 Chưa đọc<b>${d.unreadCount}</b></div></div>
 <div class="cards">${d.announcements.slice(0,6).map(card).join('')||'<div class="card">Không có thông báo.</div>'}</div>`;
}
function renderNotices(){
 const d=state.dashboard,f=state.filters;
 $('notices').innerHTML=`<div class="hero"><div><h2>📢 Thông báo</h2><div class="muted">Thông báo mới nhất luôn ở trên.</div></div></div>
 <div class="filters">
 <input id="search" placeholder="🔎 Tiêu đề, nội dung, bộ phận, từ khóa..." value="${attr(f.search||'')}">
 <input id="dateFrom" type="date" value="${attr(f.dateFrom||'')}" title="Từ ngày">
 <input id="dateTo" type="date" value="${attr(f.dateTo||'')}" title="Đến ngày">
 <select id="type"><option value="">🏷️ Tất cả loại</option>${TYPES.map(x=>`<option value="${attr(x)}" ${f.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <select id="department"><option value="">📍 Tất cả bộ phận</option>${d.departments.map(x=>`<option value="${attr(x)}" ${f.department===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <button class="primary" onclick="applyFilters()">Lọc</button></div>
 <label style="margin:8px 0 15px"><input id="unread" type="checkbox" ${f.unreadOnly?'checked':''}> 🔴 Chưa đọc</label>
 <div class="cards">${d.announcements.map(card).join('')||'<div class="card">Không tìm thấy thông báo phù hợp.</div>'}</div>`;
}

function applyFilters(){
  state.filters={search:$('search').value,dateFrom:$('dateFrom').value,dateTo:$('dateTo').value,type:$('type').value,department:$('department').value,unreadOnly:$('unread').checked};load();
}
async function important(){
  await withLoading('Đang tải thông báo quan trọng...',async()=>{
    try{
      const r=await api('important',{token:state.token});
      $('important').innerHTML='<div class="hero"><div><h2>📌 Quan trọng</h2><div class="muted">Thông báo ghim, ưu tiên cao/khẩn cấp.</div></div></div><div class="cards">'+((r.announcements||[]).map(card).join('')||'<div class="card">Chưa có thông báo quan trọng.</div>')+'</div>';
      nav('important');
    }catch(e){toast(e.message)}
  });
}
async function openNotice(id){
  await withLoading('Đang tải thông báo...',async()=>{
    try{
      const r=await api('announcement',{token:state.token,id}),a=r.announcement,att=r.attachment;
      $('modal').classList.remove('hidden');
      $('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${esc(a.title)}</h2><button class="close" onclick="closeModal()">×</button></div>
      <div class="meta">${fmt(a.publishDate)} · ${esc(a.type)} · ${esc(a.author||'')}</div><hr><div class="content">${htmlContent(a.content)}</div>
      ${att?attachment(att):''}<div style="margin-top:18px"><span class="badge">✓ Đã đọc</span></div></div>`;
      state.dashboard=await api('dashboard',{token:state.token,filters:state.filters});
      renderHome();renderNotices();
    }catch(e){toast(e.message)}
  });
}
function attachment(a){
 const url=a.previewUrl||a.url||'';if(!url)return'';
 return `<div class="attachment"><b>📎 ${esc(a.name||'Tệp đính kèm')}</b><p><a href="${attr(url)}" target="_blank" rel="noopener">Mở tệp</a></p><iframe src="${attr(url)}"></iframe></div>`;
}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function renderProfile(){
 $('profile').innerHTML=`<div class="card"><h2>👤 Cá nhân</h2><p><b>Mã nhân viên:</b> ${esc(state.user.employeeId)}</p><p><b>Họ tên:</b> ${esc(state.user.fullName)}</p><p><b>Bộ phận:</b> ${esc(state.user.department||'')}</p><p><b>Quyền:</b> ${esc(state.user.role||'EMPLOYEE')}</p></div>`;
}


/* ---------- ADMIN UI ---------- */
async function renderAdmin(){
  if(!isAdmin())return;
  await withLoading('Đang tải quản trị...',async()=>{
    try{
      const [r,e]=await Promise.all([api('adminDashboard',{token:state.token}),api('employees',{token:state.token,query:adminEmployeeSearch})]);
      state.adminEmployees=e.employees||[];
      $('admin').innerHTML=`<div class="hero"><div><h2>⚙️ QUẢN TRỊ</h2><div class="muted">Quản lý nhân viên và thông báo.</div></div><div class="actions"><button class="btn" onclick="employeeModal()">＋ Nhân viên</button><button class="btn" onclick="importModal()">📥 Import Excel</button><button class="primary" onclick="announcementModal()">＋ Tạo thông báo</button></div></div>
      <div class="stats"><div class="stat">Nhân viên ACTIVE<b>${r.stats.employees}</b></div><div class="stat">Thông báo<b>${r.stats.announcements}</b></div><div class="stat">Đã đăng<b>${r.stats.published}</b></div><div class="stat">Hẹn giờ<b>${r.stats.scheduled}</b></div><div class="stat">Lượt đọc<b>${r.stats.totalReads}</b></div></div>
      <h3>👥 Nhân viên</h3><div class="filters"><input id="empSearch" placeholder="🔎 EmployeeID, CCCD, họ tên, bộ phận..." value="${attr(adminEmployeeSearch)}"><button class="primary" onclick="loadAdminEmployees()">Tìm</button></div>
      <div class="tablebox"><table class="table"><thead><tr><th>EmployeeID/CCCD</th><th>Họ tên</th><th>Bộ phận</th><th>Chức vụ</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${state.adminEmployees.map(x=>`<tr><td>${esc(x.EmployeeID)}</td><td>${esc(x.FullName)}</td><td>${esc(x.Department)}</td><td>${esc(x.Position)}</td><td>${esc(x.Role)}</td><td>${esc(x.Status)}</td><td><div class="actions"><button class="btn" onclick="employeeModal(${attr(JSON.stringify(x))})">✏️</button><button class="btn" onclick="toggleEmployeeStatus('${attr(x.EmployeeID)}')">${x.Status==='ACTIVE'?'⛔':'✅'}</button><button class="btn" onclick="deleteEmployee('${attr(x.EmployeeID)}')">🗑️</button></div></td></tr>`).join('')||'<tr><td colspan="7">Không có nhân viên.</td></tr>'}</tbody></table></div>
      <h3 style="margin-top:24px">📢 Thông báo</h3><div class="tablebox"><table class="table"><thead><tr><th>Ngày</th><th>Tiêu đề</th><th>Loại</th><th>Người đăng</th><th>Trạng thái</th><th>Đối tượng</th><th>Thao tác</th></tr></thead><tbody>${(r.announcements||[]).map(a=>`<tr><td>${fmt(a.publishDate)}</td><td>${a.pinned?'📌 ':''}${esc(a.title)}</td><td>${esc(a.type)}</td><td>${esc(a.author)}</td><td>${esc(a.status)}</td><td>${esc(a.targetText)}</td><td><div class="actions"><button class="btn" onclick="openNotice('${attr(a.id)}')">👁️</button><button class="btn" onclick="editAnnouncement('${attr(a.id)}')">✏️</button><button class="btn" onclick="pin('${attr(a.id)}')">📌</button><button class="btn" onclick="stats('${attr(a.id)}')">📊</button><button class="btn" onclick="delAnn('${attr(a.id)}')">🗑️</button></div></td></tr>`).join('')||'<tr><td colspan="7">Chưa có thông báo.</td></tr>'}</tbody></table></div>`;
    }catch(e){toast(e.message)}
  });
}
async function loadAdminEmployees(){adminEmployeeSearch=$('empSearch')?.value?.trim()||'';renderAdmin()}
function employeeModal(e=null){
  e=e||{};$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${e.EmployeeID?'✏️ Sửa nhân viên':'＋ Thêm nhân viên'}</h2><button class="close" onclick="closeModal()">×</button></div>
  <label>EmployeeID / Số căn cước *</label><input id="eid" value="${attr(e.EmployeeID||'')}" ${e.EmployeeID?'readonly':''}><div class="grid2"><div><label>Họ tên *</label><input id="efull" value="${attr(e.FullName||'')}"></div><div><label>Bộ phận</label><input id="edept" value="${attr(e.Department||'')}"></div><div><label>Chức vụ</label><input id="epos" value="${attr(e.Position||'')}"></div><div><label>Email</label><input id="eemail" value="${attr(e.Email||'')}"></div><div><label>Điện thoại</label><input id="ephone" value="${attr(e.Phone||'')}"></div><div><label>Vai trò</label><select id="erole"><option value="EMPLOYEE" ${e.Role==='EMPLOYEE'?'selected':''}>EMPLOYEE</option><option value="HR" ${e.Role==='HR'?'selected':''}>HR</option><option value="ADMIN" ${e.Role==='ADMIN'?'selected':''}>ADMIN</option></select></div><div><label>Trạng thái</label><select id="estatus"><option value="ACTIVE" ${e.Status!=='INACTIVE'?'selected':''}>ACTIVE</option><option value="INACTIVE" ${e.Status==='INACTIVE'?'selected':''}>INACTIVE</option></select></div></div><button class="primary full" onclick="saveEmployee()">LƯU</button></div>`;
}
async function saveEmployee(){await withLoading('Đang lưu nhân viên...',async()=>{try{const data={employeeId:$('eid').value.trim(),fullName:$('efull').value.trim(),department:$('edept').value.trim(),position:$('epos').value.trim(),email:$('eemail').value.trim(),phone:$('ephone').value.trim(),role:$('erole').value,status:$('estatus').value};await api('saveEmployee',{token:state.token,data});closeModal();renderAdmin();toast('Đã lưu nhân viên')}catch(e){toast(e.message)}})}
async function toggleEmployeeStatus(id){if(!confirm('Đổi trạng thái nhân viên này?'))return;await withLoading('Đang cập nhật...',async()=>{try{await api('toggleEmployeeStatus',{token:state.token,employeeId:id});renderAdmin()}catch(e){toast(e.message)}})}
async function deleteEmployee(id){if(!confirm('Xóa nhân viên này? Nếu chỉ muốn khóa, nên chọn INACTIVE.'))return;await withLoading('Đang xóa...',async()=>{try{await api('deleteEmployee',{token:state.token,employeeId:id});renderAdmin()}catch(e){toast(e.message)}})}

function announcementModal(a=null){
  a=a||{};$('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${a.id?'✏️ Sửa':'＋ Tạo'} thông báo</h2><button class="close" onclick="closeModal()">×</button></div>
  <input id="aid" type="hidden" value="${attr(a.id||'')}"><label>Tiêu đề *</label><input id="atitle" value="${attr(a.title||'')}"><label>Nội dung *</label><textarea id="acontent">${esc(a.content||'')}</textarea><div class="grid2"><div><label>Loại</label><select id="atype">${TYPES.map(x=>`<option ${a.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Ưu tiên</label><select id="apriority"><option>NORMAL</option><option ${a.priority==='HIGH'?'selected':''}>HIGH</option><option ${a.priority==='URGENT'?'selected':''}>URGENT</option></select></div><div><label>Ngày đăng</label><input id="adate" type="datetime-local" value="${localInput(a.publishDate)}"></div><div><label>⏰ Hẹn giờ</label><input id="aschedule" type="datetime-local" value="${localInput(a.scheduledAt)}"></div></div><label>Từ khóa</label><input id="akeywords" value="${attr(a.keywords||'')}"><label><input id="apinned" type="checkbox" ${a.pinned?'checked':''}> 📌 Ghim</label><label>Đối tượng xem</label><div id="targets"></div><button class="btn" onclick="addTarget()">＋ Thêm điều kiện</button><div class="drop"><input id="afile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.gif,.webp,.mp4"></div><button class="primary full" onclick="saveAnnouncement()">LƯU THÔNG BÁO</button></div>`;
  (a.targets?.length?a.targets:[{type:'ALL',value:'ALL'}]).forEach(addTargetRow);
}
function addTargetRow(t={type:'ALL',value:'ALL'}){const d=document.createElement('div');d.className='target';d.innerHTML=`<select><option value="ALL">ALL</option><option value="DEPARTMENT">DEPARTMENT</option><option value="EMPLOYEE">EMPLOYEE</option><option value="TYPE">VAI TRÒ/CHỨC VỤ</option></select><input placeholder="ALL / bộ phận / EmployeeID / chức vụ" value="${attr(t.value||'')}"><button class="btn" onclick="this.parentNode.remove()">×</button>`;d.children[0].value=t.type||'ALL';$('targets').appendChild(d)}
function addTarget(){addTargetRow()}
function localInput(x){if(!x)return'';const d=new Date(x);if(isNaN(d))return'';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
async function saveAnnouncement(){await withLoading('Đang lưu thông báo...',async()=>{try{let attachmentJson=null;const file=$('afile').files[0];if(file)attachmentJson=await upload(file);const targets=[...document.querySelectorAll('#targets .target')].map(x=>({type:x.children[0].value,value:x.children[1].value.trim()||'ALL'}));await api('saveAnnouncement',{token:state.token,data:{id:$('aid').value,title:$('atitle').value,content:$('acontent').value,type:$('atype').value,priority:$('apriority').value,pinned:$('apinned').checked,publishDate:$('adate').value,scheduledAt:$('aschedule').value,keywords:$('akeywords').value,targets,attachmentJson}});closeModal();renderAdmin();toast('Đã lưu thông báo')}catch(e){toast(e.message)}})}
async function upload(file){if(file.size>25*1024*1024)throw new Error('File tối đa 25MB.');const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});const x=await api('uploadAttachment',{token:state.token,file:{name:file.name,mimeType:file.type,base64:b64}});return x.attachment}
async function editAnnouncement(id){try{const r=await api('announcement',{token:state.token,id});announcementModal({...r.announcement,targets:r.targets||[]})}catch(e){toast(e.message)}}
async function pin(id){await withLoading('Đang cập nhật ghim...',async()=>{try{await api('togglePinned',{token:state.token,id});await renderAdmin()}catch(e){toast(e.message)}})}
async function delAnn(id){if(!confirm('Xóa thông báo này?'))return;await withLoading('Đang xóa thông báo...',async()=>{try{await api('deleteAnnouncement',{token:state.token,id});await renderAdmin()}catch(e){toast(e.message)}})}
async function stats(id){await withLoading('Đang tải thống kê...',async()=>{try{const r=await api('readStats',{token:state.token,id});alert(`THÔNG BÁO: ${r.title}\nĐối tượng: ${r.audience.toLocaleString()}\n✓ Đã đọc: ${r.read.toLocaleString()}\n○ Chưa đọc: ${r.unread.toLocaleString()}\nTỷ lệ đọc: ${r.rate.toFixed(2)}%`)}catch(e){toast(e.message)}});}

/* ---------- EXCEL ---------- */
let importRows=[],importName='';
async function loadXLSX(){
 if(window.XLSX)return;
 await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
}
function importModal(){
 $('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>📥 Import nhân viên từ Excel</h2><button class="close" onclick="closeModal()">×</button></div>
 <p><b>EmployeeID/CCCD được lưu dạng TEXT</b> để giữ số 0 ở đầu. Nếu file Excel đang để cột CCCD là số, nên định dạng cột đó là <b>Text</b> trước khi lưu.</p><p>EmployeeID là khóa chính. Không xóa nhân viên cũ.</p><div class="drop"><input id="excel" type="file" accept=".xlsx,.xls,.csv"></div>
 <label><input type="radio" name="missing" value="NO_CHANGE" checked> Không thay đổi người không có trong Excel</label>
 <label><input type="radio" name="missing" value="INACTIVE"> Đánh dấu INACTIVE</label>
 <div id="preview" style="margin-top:15px"></div><button class="primary full" onclick="previewImport()">1. Xem trước</button><button id="commit" class="primary full hidden" onclick="commitImport()">2. Xác nhận Import</button></div>`;
}
async function previewImport(){
 await withLoading('Đang đọc và kiểm tra Excel...',async()=>{
 try{
  await loadXLSX();const f=$('excel').files[0];if(!f)throw new Error('Chọn file Excel.');
  importName=f.name;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  importRows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});const r=await api('previewEmployeeImport',{token:state.token,rows:importRows});
  $('preview').innerHTML=`<div class="stat">Tổng: <b>${r.total}</b> Thêm: ${r.added} · Cập nhật: ${r.updated} · Trùng: ${r.duplicates.length}</div>
  <div class="tablebox" style="margin-top:10px"><table class="table"><thead><tr><th>EmployeeID</th><th>Họ tên</th><th>Bộ phận</th><th>Action</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${esc(x.EmployeeID)}</td><td>${esc(x.FullName)}</td><td>${esc(x.Department)}</td><td>${esc(x.action)}</td></tr>`).join('')}</tbody></table></div>`;
  $('commit').classList.remove('hidden');
 }catch(e){toast(e.message)}
 });
}
async function commitImport(){
 if(!importRows.length)return;if(!confirm('Xác nhận ghi dữ liệu vào Google Sheets?'))return;
 await withLoading('Đang import nhân viên vào Google Sheets...',async()=>{
 try{
  const missing=document.querySelector('input[name="missing"]:checked').value;
  const r=await api('commitEmployeeImport',{token:state.token,rows:importRows,fileName:importName,missingAction:missing});
  alert(`Import thành công\nThêm: ${r.added}\nCập nhật: ${r.updated}\nBỏ qua: ${r.skipped}\nINACTIVE: ${r.markedInactive}\nImport ID: ${r.importId}`);closeModal();
 }catch(e){toast(e.message)}
 });
}

/* ---------- EVENTS ---------- */
$('loginBtn').onclick=login;
$('employeeId').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('logoutBtn').onclick=logout;
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>b.dataset.page==='important'?important():nav(b.dataset.page));
boot();
</script>
</body>
</html>
