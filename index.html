<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cổng thông báo nội bộ v2.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf2ff,#f8fafc)}
.login-card{width:min(430px,100%);background:#fff;padding:34px;border-radius:22px;box-shadow:0 20px 60px #17203318}
.brand{font-weight:800;color:#2457d6;letter-spacing:.7px}.login h1{font-size:24px;margin:12px 0 5px}.muted{color:#667085}
label{display:block;font-weight:650;margin:15px 0 6px}input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid #d7deea;border-radius:10px;background:#fff;outline:none}
textarea{min-height:190px;resize:vertical}.btn{border:1px solid #d7deea;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.btn:hover{background:#f7f8fa}
.primary{border:0;background:#2457d6;color:#fff;border-radius:10px;padding:12px 16px;font-weight:750;cursor:pointer}.full{width:100%;margin-top:20px}
.error{color:#b42318;min-height:20px}.top{height:66px;background:#fff;border-bottom:1px solid #e8ecf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.user{display:flex;align-items:center;gap:8px}.nav{display:flex;gap:5px;padding:8px 28px;background:#fff;border-bottom:1px solid #e8ecf2;position:sticky;top:66px;z-index:4;overflow:auto}.nav button{border:0;background:transparent;padding:10px 13px;border-radius:9px;white-space:nowrap;cursor:pointer}.nav button.active,.nav button:hover{background:#edf2ff;color:#2457d6}
.wrap{max-width:1250px;margin:auto;padding:26px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff;border:1px solid #e7ebf2;border-radius:14px;padding:15px 19px;min-width:145px}.stat b{font-size:24px;display:block;margin-top:4px}
.filters{background:#fff;border:1px solid #e7ebf2;border-radius:14px;padding:15px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px;margin-bottom:16px}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:15px;padding:18px;cursor:pointer}.card:hover{box-shadow:0 8px 25px #17203312}.card.unread{border-left:5px solid #e53935}.head{display:flex;justify-content:space-between}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:12px;background:#edf2ff;color:#315bc9}.badge.red{background:#fff0f0;color:#b42318}.title{font-size:18px;font-weight:750;margin:8px 0}.meta{font-size:13px;color:#667085}.content{white-space:pre-wrap;line-height:1.7}.modal{position:fixed;inset:0;background:#10182880;z-index:20;display:grid;place-items:center;padding:20px}.modalbox{background:#fff;border-radius:16px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:28px;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tablebox{background:#fff;border:1px solid #e5e9f0;border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;white-space:nowrap}.actions{display:flex;gap:5px}.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:25px;text-align:center;margin-top:10px}.attachment{background:#f7f8fa;border-radius:12px;padding:14px;margin-top:20px}.attachment iframe{width:100%;height:550px;border:0}.target{display:flex;gap:7px;margin:7px 0}.target>*{flex:1}
@media(max-width:800px){.filters{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.wrap{padding:15px}.top{padding:0 14px}.nav{padding:8px 14px}.hero{align-items:flex-start;flex-direction:column}.user #who{display:none}}
.detail-link{display:inline-flex;align-items:center;gap:5px;margin-top:13px;color:#2457d6;font-weight:750;font-size:14px}.loading-overlay{position:fixed;inset:0;background:#10182855;z-index:100;display:grid;place-items:center}.loading-box{background:#fff;border-radius:16px;padding:20px 26px;box-shadow:0 20px 60px #10182830;display:flex;align-items:center;gap:13px;font-weight:700}.spinner{width:24px;height:24px;border:3px solid #dbe3f2;border-top-color:#2457d6;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<section id="login" class="login">
 <div class="login-card">
  <div class="brand">🏭 COMPANY</div>
  <h1>THÔNG BÁO NỘI BỘ</h1>
  <p class="muted">Đăng nhập để xem thông báo dành cho bạn.</p>
  <label>Mã nhân viên</label>
  <input id="employeeId" placeholder="NV000123" autocomplete="off">
  <label>Mật khẩu</label>
  <input id="password" type="password" placeholder="••••••••" autocomplete="new-password">
  <button class="primary full" id="loginBtn">ĐĂNG NHẬP</button>
  <div id="loginError" class="error"></div>
  <small>API URL được cấu hình trong biến <b>API_URL</b> của file HTML.</small>
 </div>
</section>

<section id="app" class="hidden">
 <header class="top">
  <div class="brand">🏭 COMPANY <span style="font-weight:500">THÔNG BÁO</span></div>
  <div class="user"><span id="who"></span><button class="btn" id="pwdBtn">🔑</button><button class="btn" id="logoutBtn">Đăng xuất</button></div>
 </header>
 <nav class="nav">
  <button data-page="home">🏠 Trang chủ</button>
  <button data-page="notices">📢 Thông báo</button>
  <button data-page="important">📌 Quan trọng</button>
  <button data-page="profile">👤 Cá nhân</button>
  <button id="adminNav" class="hidden" data-page="admin">⚙️ Quản trị</button>
 </nav>
 <main class="wrap">
  <div id="home"></div><div id="notices" class="hidden"></div><div id="important" class="hidden"></div><div id="profile" class="hidden"></div><div id="admin" class="hidden"></div>
 </main>
</section>

<div id="modal" class="modal hidden"></div>
<div id="loading" class="loading-overlay hidden" aria-live="polite"><div class="loading-box"><span class="spinner"></span><span id="loadingText">Đang xử lý...</span></div></div>

<script>
/* ==========================================================
   1) CHỈ CẦN ĐỔI URL NÀY
   ========================================================== */
const API_URL = 'PASTE_YOUR_GAS_WEB_APP_EXEC_URL_HERE';

/* ========================================================== */
const state={token:'',user:null,dashboard:null,filters:{}};
const TYPES=['📢 Thông báo chung','🕐 Thời gian làm việc','💰 Lương & thưởng','🎁 Phúc lợi','🏥 Sức khỏe','🦺 An toàn / HSE','🏭 Sản xuất','📋 Nhân sự','🎉 Hoạt động công ty','⚠️ Khẩn cấp'];

const $=id=>document.getElementById(id);
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(x){return esc(x)}
function toast(m){alert(m)}
function fmt(x){if(!x)return'';const d=new Date(x);return isNaN(d)?String(x):d.toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'})}
function htmlContent(x){return esc(x).replace(/\n/g,'<br>')}
function setLoading(on,text='Đang xử lý...'){ $('loadingText').textContent=text; $('loading').classList.toggle('hidden',!on); document.body.style.overflow=on?'hidden':''; }
async function withLoading(text,fn){setLoading(true,text);try{return await fn()}finally{setLoading(false)}}

async function api(action,data={}){
 if(API_URL.includes('PASTE_YOUR')) throw new Error('Bạn chưa dán URL /exec của Google Apps Script vào API_URL.');
 const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});
 const text=await res.text();
 let j;try{j=JSON.parse(text)}catch(e){throw new Error((text.includes('<!DOCTYPE')||text.includes('<html'))?'GAS đang trả về HTML thay vì JSON. Hãy Deploy > Manage deployments > Edit > New version và dùng đúng URL /exec.':'API trả về dữ liệu không hợp lệ.')}
 if(!j.ok) throw new Error(j.error||'Có lỗi xảy ra.');
 return j;
}

async function boot(){
 localStorage.removeItem('notice_token');sessionStorage.removeItem('notice_token');state.token='';showLogin();
}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}
function enter(){
 $('login').classList.add('hidden');$('app').classList.remove('hidden');
 $('who').textContent=`Xin chào ${state.user.fullName}`;
 if(['ADMIN','HR'].includes(state.user.role))$('adminNav').classList.remove('hidden');
 load();
}
async function login(){
 $('loginError').textContent='';const employeeId=$('employeeId').value.trim(),password=$('password').value;if(!employeeId||!password){$('loginError').textContent='Vui lòng nhập đầy đủ thông tin.';return}
 await withLoading('Đang đăng nhập...',async()=>{try{const r=await api('login',{employeeId,password,userAgent:navigator.userAgent});state.token=r.token;state.user=r.user;$('employeeId').value='';$('password').value='';enter()}catch(e){$('loginError').textContent=e.message}});
}
async function logout(){
 try{await api('logout',{token:state.token})}catch(e){}
 localStorage.removeItem('notice_token');sessionStorage.removeItem('notice_token');state.token='';state.user=null;$('employeeId').value='';$('password').value='';showLogin();
}

async function load(){
 try{state.dashboard=await api('dashboard',{token:state.token,filters:state.filters});renderHome();renderNotices();}catch(e){if(e.message.includes('hết hạn'))logout();else toast(e.message)}
}
function nav(page){
 ['home','notices','important','profile','admin'].forEach(x=>$(x).classList.add('hidden'));
 $(page).classList.remove('hidden');
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='profile')renderProfile();
 if(page==='admin')renderAdmin();
}
function card(a){
 return `<div class="card ${a.unread?'unread':''}" onclick="openNotice('${attr(a.id)}')">
 <div class="head"><span class="badge">${esc(a.type)}</span><span>${a.pinned?'📌':''}</span></div>
 <div class="title">${esc(a.title)}</div>
 <div class="meta">${fmt(a.publishDate)} · ${esc(a.author||'')}</div>
 <div style="margin-top:10px">${htmlContent(String(a.content||'').replace(/<[^>]*>/g,' ').slice(0,230))}${String(a.content||'').length>230?'…':''}</div>
 <div style="margin-top:10px">${a.unread?'<span class="badge red">🔴 Chưa đọc</span>':'<span class="badge">✓ Đã đọc</span>'}</div><div class="detail-link">Bấm vào xem chi tiết →</div>
 </div>`;
}
function renderHome(){
 const d=state.dashboard;
 $('home').innerHTML=`<div class="hero"><div><h2>Xin chào ${esc(state.user.fullName)} 👋</h2><div class="muted">Thông báo mới nhất dành cho ${esc(state.user.department||'bạn')}.</div></div>
 <div class="stat">🔴 Chưa đọc<b>${d.unreadCount}</b></div></div>
 <div class="cards">${d.announcements.slice(0,6).map(card).join('')||'<div class="card">Không có thông báo.</div>'}</div>`;
}
function renderNotices(){
 const d=state.dashboard,f=state.filters;
 $('notices').innerHTML=`<div class="hero"><div><h2>📢 Thông báo</h2><div class="muted">Thông báo mới nhất luôn ở trên.</div></div></div>
 <div class="filters">
 <input id="search" placeholder="🔎 Tiêu đề, nội dung, phòng ban, từ khóa, mã..." value="${attr(f.search||'')}">
 <select id="month"><option value="">📅 Tất cả tháng</option>${d.months.map(x=>`<option value="${attr(x.month)}" ${f.month===x.month?'selected':''}>Tháng ${x.month} (${x.count})</option>`).join('')}</select>
 <select id="type"><option value="">🏷️ Tất cả loại</option>${TYPES.map(x=>`<option value="${attr(x)}" ${f.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <select id="department"><option value="">📍 Tất cả bộ phận</option>${d.departments.map(x=>`<option ${f.department===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <button class="primary" onclick="applyFilters()">Lọc</button></div>
 <label style="margin:8px 0 15px"><input id="unread" type="checkbox" ${f.unreadOnly?'checked':''}> 🔴 Chưa đọc</label>
 <div class="cards">${d.announcements.map(card).join('')||'<div class="card">Không tìm thấy thông báo phù hợp.</div>'}</div>`;
}
function applyFilters(){
 state.filters={search:$('search').value,month:$('month').value,type:$('type').value,department:$('department').value,unreadOnly:$('unread').checked};load();
}
async function important(){try{await withLoading('Đang tải thông báo quan trọng...',async()=>{const r=await api('important',{token:state.token});$('important').innerHTML='<div class="hero"><div><h2>📌 Quan trọng</h2><div class="muted">Thông báo ghim, ưu tiên cao/khẩn cấp.</div></div></div><div class="cards">'+(r.announcements||[]).map(card).join('')||'<div class="card">Chưa có thông báo quan trọng.</div>'+'</div>';nav('important')})}catch(e){toast(e.message)}};nav('notices');load()}
async function openNotice(id){
 try{
  const r=await api('announcement',{token:state.token,id}),a=r.announcement,att=r.attachment;
  $('modal').classList.remove('hidden');
  $('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${esc(a.title)}</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="meta">${fmt(a.publishDate)} · ${esc(a.type)} · ${esc(a.author||'')}</div><hr><div class="content">${htmlContent(a.content)}</div>
  ${att?attachment(att):''}<div style="margin-top:18px"><span class="badge">✓ Đã đọc</span></div></div>`;
  await load();
 }catch(e){toast(e.message)}
}
function attachment(a){
 const url=a.previewUrl||a.url||'';if(!url)return'';
 return `<div class="attachment"><b>📎 ${esc(a.name||'Tệp đính kèm')}</b><p><a href="${attr(url)}" target="_blank" rel="noopener">Mở tệp</a></p><iframe src="${attr(url)}"></iframe></div>`;
}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function renderProfile(){
 $('profile').innerHTML=`<div class="card"><h2>👤 Cá nhân</h2><p><b>Mã nhân viên:</b> ${esc(state.user.employeeId)}</p><p><b>Họ tên:</b> ${esc(state.user.fullName)}</p><p><b>Bộ phận:</b> ${esc(state.user.department||'')}</p><button class="primary" onclick="passwordModal()">🔑 Đổi mật khẩu</button></div>`;
}
function passwordModal(){
 $('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>🔑 Đổi mật khẩu</h2><button class="close" onclick="closeModal()">×</button></div>
 <label>Mật khẩu cũ</label><input id="oldpw" type="password"><label>Mật khẩu mới</label><input id="newpw" type="password"><label>Nhập lại</label><input id="newpw2" type="password"><button class="primary full" onclick="changePw()">Lưu</button></div>`;
}
async function changePw(){
 if($('newpw').value!==$('newpw2').value){toast('Mật khẩu nhập lại không khớp');return}
 try{await api('changePassword',{token:state.token,oldPassword:$('oldpw').value,newPassword:$('newpw').value});toast('Đã đổi mật khẩu');closeModal()}catch(e){toast(e.message)}
}

/* ---------- ADMIN UI ---------- */
async function renderAdmin(){
 if(!['ADMIN','HR'].includes(state.user.role))return;
 try{
  const r=await api('adminDashboard',{token:state.token});
  $('admin').innerHTML=`<div class="hero"><h2>⚙️ QUẢN LÝ THÔNG BÁO</h2><div class="actions"><button class="btn" onclick="importModal()">📥 Import nhân viên</button><button class="primary" onclick="announcementModal()">＋ Tạo thông báo mới</button></div></div>
  <div class="stats"><div class="stat">Nhân viên<b>${r.stats.employees}</b></div><div class="stat">Thông báo<b>${r.stats.announcements}</b></div><div class="stat">Published<b>${r.stats.published}</b></div><div class="stat">Hẹn giờ<b>${r.stats.scheduled}</b></div><div class="stat">Lượt đọc<b>${r.stats.totalReads}</b></div></div>
  <div style="height:18px"></div><div class="tablebox"><table class="table"><thead><tr><th>Ngày</th><th>Tiêu đề</th><th>Loại</th><th>Người đăng</th><th>Trạng thái</th><th>Đối tượng</th><th>Thao tác</th></tr></thead><tbody>
  ${r.announcements.map(a=>`<tr><td>${fmt(a.publishDate)}</td><td>${a.pinned?'📌 ':''}${esc(a.title)}</td><td>${esc(a.type)}</td><td>${esc(a.author)}</td><td>${esc(a.status)}</td><td>${esc(a.targetText)}</td><td><div class="actions"><button class="btn" onclick="openNotice('${attr(a.id)}')">👁️</button><button class="btn" onclick="editAnnouncement('${attr(a.id)}')">✏️</button><button class="btn" onclick="pin('${attr(a.id)}')">📌</button><button class="btn" onclick="stats('${attr(a.id)}')">📊</button><button class="btn" onclick="delAnn('${attr(a.id)}')">🗑️</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
 }catch(e){toast(e.message)}
}
function announcementModal(existing=null){
 const a=existing||{};
 $('modal').classList.remove('hidden');
 $('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>${a.id?'✏️ Sửa':'＋ Tạo'} thông báo</h2><button class="close" onclick="closeModal()">×</button></div>
 <input id="aid" type="hidden" value="${attr(a.id||'')}"><label>Tiêu đề</label><input id="atitle" value="${attr(a.title||'')}">
 <label>Nội dung</label><textarea id="acontent">${esc(a.content||'')}</textarea>
 <div class="grid2"><div><label>Loại</label><select id="atype">${TYPES.map(x=>`<option ${a.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
 <div><label>Ưu tiên</label><select id="apriority"><option>NORMAL</option><option ${a.priority==='HIGH'?'selected':''}>HIGH</option><option ${a.priority==='URGENT'?'selected':''}>URGENT</option></select></div></div>
 <div class="grid2"><div><label>Ngày đăng</label><input id="adate" type="datetime-local" value="${localInput(a.publishDate)}"></div><div><label>⏰ Hẹn giờ đăng</label><input id="aschedule" type="datetime-local"></div></div>
 <label>Từ khóa</label><input id="akeywords" value="${attr(a.keywords||'')}"><label><input id="apinned" type="checkbox" ${a.pinned?'checked':''}> 📌 Ghim</label>
 <label>Đối tượng xem</label><div id="targets"><div class="target"><select><option value="ALL">ALL</option><option value="DEPARTMENT">DEPARTMENT</option><option value="EMPLOYEE">EMPLOYEE</option><option value="TYPE">TYPE</option></select><input placeholder="ALL / bộ phận / mã NV / chức danh"></div></div>
 <button class="btn" onclick="addTarget()">＋ Thêm điều kiện</button><div class="drop"><input id="afile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.gif,.webp,.mp4"></div>
 <button class="primary full" onclick="saveAnnouncement()">LƯU THÔNG BÁO</button></div>`;
}
function addTarget(){const d=document.createElement('div');d.className='target';d.innerHTML=`<select><option value="ALL">ALL</option><option value="DEPARTMENT">DEPARTMENT</option><option value="EMPLOYEE">EMPLOYEE</option><option value="TYPE">TYPE</option></select><input placeholder="Giá trị"><button class="btn" onclick="this.parentNode.remove()">×</button>`;$('targets').appendChild(d)}
function localInput(x){if(!x)return'';const d=new Date(x);if(isNaN(d))return'';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
async function saveAnnouncement(){
 await withLoading('Đang lưu thông báo...',async()=>{
 try{
  let attachmentJson=null;const file=$('afile').files[0];if(file)attachmentJson=(await upload(file));
  const targets=[...document.querySelectorAll('#targets .target')].map(x=>({type:x.children[0].value,value:x.children[1].value||'ALL'}));
  await api('saveAnnouncement',{token:state.token,data:{id:$('aid').value,title:$('atitle').value,content:$('acontent').value,type:$('atype').value,priority:$('apriority').value,pinned:$('apinned').checked,publishDate:$('adate').value,scheduledAt:$('aschedule').value,keywords:$('akeywords').value,targets,attachmentJson}});
  closeModal();renderAdmin();toast('Đã lưu thông báo');
 }catch(e){toast(e.message)}
 });
}
async function upload(file){
 if(file.size>25*1024*1024)throw new Error('File tối đa 25MB.');
 const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)});
 const x=await api('uploadAttachment',{token:state.token,file:{name:file.name,mimeType:file.type,base64:b64}});
 return x.attachment;
}
async function editAnnouncement(id){
 try{
  const r=await api('adminDashboard',{token:state.token});const a=r.announcements.find(x=>x.id===id);if(a)announcementModal(a);
 }catch(e){toast(e.message)}
}
async function pin(id){try{await api('togglePinned',{token:state.token,id});renderAdmin()}catch(e){toast(e.message)}}
async function delAnn(id){if(!confirm('Xóa thông báo này?'))return;try{await api('deleteAnnouncement',{token:state.token,id});renderAdmin()}catch(e){toast(e.message)}}
async function stats(id){try{const r=await api('readStats',{token:state.token,id});alert(`THÔNG BÁO: ${r.title}\nĐối tượng: ${r.audience.toLocaleString()}\n✓ Đã đọc: ${r.read.toLocaleString()}\n○ Chưa đọc: ${r.unread.toLocaleString()}\nTỷ lệ đọc: ${r.rate.toFixed(2)}%`)}catch(e){toast(e.message)}}

/* ---------- EXCEL ---------- */
let importRows=[],importName='';
async function loadXLSX(){
 if(window.XLSX)return;
 await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
}
function importModal(){
 $('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="modalbox"><div class="modalhead"><h2>📥 Import nhân viên từ Excel</h2><button class="close" onclick="closeModal()">×</button></div>
 <p>EmployeeID là khóa chính. Không xóa nhân viên cũ.</p><div class="drop"><input id="excel" type="file" accept=".xlsx,.xls,.csv"></div>
 <label><input type="radio" name="missing" value="NO_CHANGE" checked> Không thay đổi người không có trong Excel</label>
 <label><input type="radio" name="missing" value="INACTIVE"> Đánh dấu INACTIVE</label>
 <div id="preview" style="margin-top:15px"></div><button class="primary full" onclick="previewImport()">1. Xem trước</button><button id="commit" class="primary full hidden" onclick="commitImport()">2. Xác nhận Import</button></div>`;
}
async function previewImport(){
 await withLoading('Đang đọc và kiểm tra Excel...',async()=>{
 try{
  await loadXLSX();const f=$('excel').files[0];if(!f)throw new Error('Chọn file Excel.');
  importName=f.name;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  importRows=XLSX.utils.sheet_to_json(ws,{defval:''});const r=await api('previewImport',{token:state.token,rows:importRows});
  $('preview').innerHTML=`<div class="stat">Tổng: <b>${r.total}</b> Thêm: ${r.added} · Cập nhật: ${r.updated} · Trùng: ${r.duplicates.length}</div>
  <div class="tablebox" style="margin-top:10px"><table class="table"><thead><tr><th>EmployeeID</th><th>Họ tên</th><th>Bộ phận</th><th>Action</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${esc(x.EmployeeID)}</td><td>${esc(x.FullName)}</td><td>${esc(x.Department)}</td><td>${esc(x.action)}</td></tr>`).join('')}</tbody></table></div>`;
  $('commit').classList.remove('hidden');
 }catch(e){toast(e.message)}
 });
}
async function commitImport(){
 if(!importRows.length)return;if(!confirm('Xác nhận ghi dữ liệu vào Google Sheets?'))return;
 await withLoading('Đang import nhân viên vào Google Sheets...',async()=>{
 try{
  const missing=document.querySelector('input[name="missing"]:checked').value;
  const r=await api('commitImport',{token:state.token,rows:importRows,fileName:importName,missingAction:missing});
  alert(`Import thành công\nThêm: ${r.added}\nCập nhật: ${r.updated}\nBỏ qua: ${r.skipped}\nINACTIVE: ${r.markedInactive}\nImport ID: ${r.importId}`);closeModal();
 }catch(e){toast(e.message)}
 });
}

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>b.dataset.page==='important'?important():nav(b.dataset.page));
boot();
