<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cổng thông báo nội bộ</title>
  <style><?!= include('style'); ?></style>
</head>
<body>
  <div id="toast"></div>

  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="brand">🏭 COMPANY</div>
      <h1>THÔNG BÁO NỘI BỘ</h1>
      <p class="muted">Đăng nhập để xem thông báo dành cho bạn</p>
      <label>Mã nhân viên</label>
      <input id="loginId" placeholder="NV000123" autocomplete="username">
      <label>Mật khẩu</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="primary full" onclick="doLogin()">ĐĂNG NHẬP</button>
      <p id="loginError" class="error"></p>
      <small>Mật khẩu mặc định của tài khoản ADMIN001 sau setup: ChangeMe@123. Hãy đổi ngay.</small>
    </div>
  </section>

  <section id="mainView" class="hidden">
    <header class="topbar">
      <div class="brand">🏭 COMPANY <span>THÔNG BÁO</span></div>
      <div class="userbox">
        <span id="hello"></span>
        <button class="ghost" onclick="showPasswordModal()">🔑</button>
        <button class="ghost" onclick="doLogout()">Đăng xuất</button>
      </div>
    </header>

    <nav class="nav">
      <button class="navbtn active" onclick="showPage('home')">🏠 Trang chủ</button>
      <button class="navbtn" onclick="showPage('notices')">📢 Thông báo</button>
      <button class="navbtn" onclick="filterUnread()">📌 Quan trọng</button>
      <button class="navbtn" onclick="showPage('profile')">👤 Cá nhân</button>
      <button id="adminNav" class="navbtn hidden" onclick="showPage('admin')">⚙️ Quản trị</button>
    </nav>

    <main class="container">
      <div id="homePage"></div>
      <div id="noticesPage" class="hidden"></div>
      <div id="profilePage" class="hidden"></div>
      <div id="adminPage" class="hidden"></div>
    </main>
  </section>

  <div id="modal" class="modal hidden"></div>
  <script><?!= include('client'); ?></script>
</body>
</html>
